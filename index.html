<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter Arc Tracker</title>
<style>
  :root {
    --bg-color: #241a16; --accent: #bda56d; --text-main: #f4ede4;
    --panel-bg: #32251f; --grid-bg: #403028; --grid-text: #a89f91;
    --perfect-color: #f2e8cf; --perfect-text: #241a16;
    --partial-color: #c9bca7; --partial-text: #241a16;
  }
  body.sprint-mode {
    --bg-color: #0b1524; --accent: #fdf5e6; --text-main: #ffffff;
    --panel-bg: #152238; --grid-bg: #1d2d44; --grid-text: #8c9bab;
    --perfect-color: #f2e8cf; --perfect-text: #241a16;
    --partial-color: #b2b9c6; --partial-text: #0b1524;
  }
  body { background-color: #000; display: flex; justify-content: center; align-items: center; font-family: -apple-system, sans-serif; min-height: 100vh; margin: 0; padding: 20px; color: var(--text-main); }
  .widget { background: var(--bg-color); width: 420px; border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: all 0.3s ease; }
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 6px; }
  .tab { flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-main); cursor: pointer; border-radius: 8px; font-weight: 600; font-size: 0.9em; opacity: 0.5; transition: 0.2s; }
  .tab.active { background: rgba(255,255,255,0.05); opacity: 1; color: var(--accent); }
  .quote { text-align: center; font-style: italic; font-size: 0.95em; margin-bottom: 20px; padding: 16px; background: rgba(0,0,0,0.2); border-radius: 12px; }
  .stats { display: flex; justify-content: space-between; margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 16px; border-radius: 12px; }
  .stat-box { text-align: center; flex: 1; }
  .stat-label { font-size: 0.65em; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; }
  .stat-value { font-size: 1.3em; font-weight: 700; color: var(--accent); margin-top: 6px; transition: color 0.3s; }
  .grid-container { background: rgba(0,0,0,0.2); padding: 16px; border-radius: 12px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { background: var(--grid-bg); color: var(--grid-text); padding: 12px 0; text-align: center; font-size: 0.85em; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
  .day:hover { transform: scale(1.05); }
  .day.special { grid-column: span 7; font-weight: bold; }
  
  /* Vacation Visuals */
  .day.vacation-mode:not(.perfect):not(.partial) { 
    background: #b5c1b5 !important; /* Soft sage green */
    color: #241a16 !important; 
    border: 2px dashed #241a16 !important; 
  }
  .day.vacation-mode.partial { border: 2px dashed var(--partial-text) !important; }
  
  .day.perfect { background: var(--perfect-color) !important; color: var(--perfect-text) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.2); border: 2px solid transparent !important; }
  .day.partial { background: var(--partial-color) !important; color: var(--partial-text) !important; border-style: solid; }
  .day.active-day { border-color: var(--accent); transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,0.4); z-index: 2; position: relative; }
  
  .checklist { background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; }
  .checklist-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
  .task { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 10px; transition: 0.2s; }
  .task:focus-within { border-color: var(--accent); }
  .task input[type="checkbox"] { accent-color: var(--accent); transform: scale(1.2); cursor: pointer; }
  .task input[type="checkbox"]:checked + input[type="text"] { text-decoration: line-through; opacity: 0.5; }
  .task input[type="text"] { background: transparent; border: none; color: var(--text-main); flex: 1; font-size: 0.95em; outline: none; }
  .task button { background: transparent; border: none; color: rgba(255,255,255,0.3); cursor: pointer; font-size: 1em; transition: 0.2s; }
  .task button:hover { color: #ff5555; }
  .add-task { display: flex; gap: 10px; margin-top: 15px; }
  .add-task input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: rgba(0,0,0,0.3); color: white; outline: none; }
  .add-task input:focus { border: 1px solid var(--accent); }
  .add-task button { padding: 12px 20px; border-radius: 8px; border: none; background: var(--accent); color: var(--bg-color); font-weight: bold; cursor: pointer; transition: 0.2s; }
  .add-task button:hover { opacity: 0.8; }
  
  .vacation-toggle { margin-top: 20px; font-size: 0.85em; opacity: 0.8; display: flex; align-items: center; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
  .vacation-toggle input { cursor: pointer; accent-color: var(--accent); transform: scale(1.2); margin-right: 8px; }
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="tabs">
    <button class="tab" onclick="switchTab('autumn')">🍂 Autumn Warm-Up</button>
    <button class="tab" onclick="switchTab('sprint')">❄️ Winter Arc Sprint</button>
  </div>
  
  <div class="quote" id="quoteText"></div>
  
  <div class="stats">
    <div class="stat-box"><div class="stat-label">Day Index</div><div class="stat-value" id="dayIndex"></div></div>
    <div class="stat-box"><div class="stat-label">Perfect Days</div><div class="stat-value" id="perfectDaysCount">0 🔥</div></div>
    <div class="stat-box"><div class="stat-label">Arc Level</div><div class="stat-value" id="arcLevel">0%</div></div>
  </div>

  <div class="grid-container">
    <div class="grid" id="calendarGrid"></div>
  </div>

  <div class="checklist">
    <div class="checklist-header">
      <strong id="checklistHeader">Day 1 Tracker</strong>
    </div>
    <div id="taskList"></div>
    <div class="add-task">
      <input type="text" id="newTaskInput" placeholder="Add new discipline..." onkeypress="handleEnter(event)">
      <button onclick="addTask()">Add</button>
    </div>
    <div class="vacation-toggle">
      <label>
        <input type="checkbox" id="vacationCheckbox" onchange="toggleVacation(this.checked)">
        Set as Vacation Day
      </label>
    </div>
  </div>
</div>

<script>
  const config = {
    autumn: { quote: '"Autumn is the calm before the glow-up."', days: 31, special: "Winter Arc Eve: Final Prep" },
    sprint: { quote: '"While they rest, you build."', days: 65, special: null }
  };

  let currentTheme = 'autumn';
  let currentDay = 1;
  
  let defaultTasks = {
    autumn: ['Warm tea & plan the day', '30 min outdoor crisp air walk', 'Read 10 pages by cozy light'],
    sprint: ['Wake up early', 'Morning workout', 'Build something']
  };
  
  let savedTasks = JSON.parse(localStorage.getItem('arcTasks'));
  let tasks = { ...defaultTasks, ...(savedTasks || {}) };

  let progress = JSON.parse(localStorage.getItem('arcProgress')) || { autumn: {}, sprint: {} };
  let vacations = JSON.parse(localStorage.getItem('arcVacations')) || { autumn: {}, sprint: {} };

  function saveData() {
    localStorage.setItem('arcTasks', JSON.stringify(tasks));
    localStorage.setItem('arcProgress', JSON.stringify(progress));
    localStorage.setItem('arcVacations', JSON.stringify(vacations));
  }

  function switchTab(theme) {
    currentTheme = theme;
    currentDay = 1;
    document.body.className = theme === 'sprint' ? 'sprint-mode' : '';
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (theme === 'autumn' && i === 0) || (theme === 'sprint' && i === 1));
    });
    document.getElementById('quoteText').innerText = config[theme].quote;
    renderGrid();
    renderTasks();
  }

  function selectDay(day) {
    currentDay = day;
    renderGrid();
    renderTasks();
  }

  function toggleVacation(isChecked) {
    vacations[currentTheme][currentDay] = isChecked;
    saveData();
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    const days = config[currentTheme].days;
    let perfectCount = 0;
    
    for(let i = 1; i <= days; i++) {
      const totalTasks = tasks[currentTheme].length;
      const dayData = progress[currentTheme][i] || [];
      const checkedTasks = dayData.filter((v, idx) => v === true && idx < totalTasks).length;
      const isVacation = vacations[currentTheme][i];
      
      let statusClass = '';
      if (totalTasks > 0 && checkedTasks === totalTasks) {
        statusClass = 'perfect';
        perfectCount++;
      } else if (checkedTasks > 0) {
        statusClass = 'partial';
      }
      
      if (isVacation) statusClass += ' vacation-mode';
      
      const activeClass = i === currentDay ? 'active-day' : '';
      const specialClass = (i === days && config[currentTheme].special) ? 'special' : '';
      const content = specialClass ? `Day ${i}: ${config[currentTheme].special}` : i;
      
      grid.innerHTML += `<div class="day ${statusClass} ${activeClass} ${specialClass}" onclick="selectDay(${i})">${content}</div>`;
    }
    
    document.getElementById('dayIndex').innerText = `#${currentDay} / ${days}`;
    document.getElementById('checklistHeader').innerText = `Day ${currentDay} Tracker`;
    document.getElementById('vacationCheckbox').checked = !!vacations[currentTheme][currentDay];
    
    const perfectStat = document.getElementById('perfectDaysCount');
    perfectStat.innerText = `${perfectCount} 🔥`;
    perfectStat.style.color = 'var(--perfect-color)';
  }

  function renderTasks() {
    const list = document.getElementById('taskList');
    list.innerHTML = '';
    const dayData = progress[currentTheme][currentDay] || [];
    const total = tasks[currentTheme].length;
    
    tasks[currentTheme].forEach((task, index) => {
      const isChecked = dayData[index] ? 'checked' : '';
      list.innerHTML += `
        <div class="task">
          <input type="checkbox" onchange="toggleTask(${index}, this.checked)" ${isChecked}>
          <input type="text" value="${task}" onchange="editTask(${index}, this.value)">
          <button onclick="deleteTask(${index})">✕</button>
        </div>
      `;
    });
    
    const checked = dayData.filter((v, idx) => v === true && idx < total).length;
    const percent = total === 0 ? 0 : Math.round((checked / total) * 100);
    document.getElementById('arcLevel').innerText = percent + '%';
  }

  function toggleTask(index, isChecked) {
    if (!progress[currentTheme][currentDay]) progress[currentTheme][currentDay] = [];
    progress[currentTheme][currentDay][index] = isChecked;
    saveData();
    renderGrid();
    renderTasks();
  }

  function editTask(index, newValue) {
    tasks[currentTheme][index] = newValue;
    saveData();
  }

  function deleteTask(index) {
    tasks[currentTheme].splice(index, 1);
    for (let day in progress[currentTheme]) {
       if (progress[currentTheme][day]) {
         progress[currentTheme][day].splice(index, 1);
       }
    }
    saveData();
    renderGrid();
    renderTasks();
  }

  function addTask() {
    const input = document.getElementById('newTaskInput');
    const val = input.value.trim();
    if (!val) return;
    
    tasks[currentTheme].push(val);
    saveData();
    input.value = '';
    renderGrid();
    renderTasks();
  }

  function handleEnter(event) {
    if (event.key === 'Enter') addTask();
  }

  switchTab('autumn');
</script>
</body>
</html>
